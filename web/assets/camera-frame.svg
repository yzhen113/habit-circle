    <path d="M313.5 2H339a13 13 0 0 1 13 13v38.5" />
    <path d="M352 462v38.62a13 13 0 0 1-13 13h-25.5" />
    <path d="M2 462v38.62a13 13 0 0 0 13 13h25.5" />
  </g>
</svg>
